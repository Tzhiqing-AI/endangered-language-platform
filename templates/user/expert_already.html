{% extends "base.html" %}

{% block title %}已为专家 - 濒危语言保护平台{% endblock %}

{% block extra_css %}
<style>
.expert-status-card {
    max-width: 520px;
    margin: 60px auto;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(15, 23, 42, 0.08);
    border: 1px solid rgba(15, 23, 42, 0.06);
    background: #ffffff;
}
.expert-status-header {
    background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
    color: #1f2937;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 1.05rem;
    font-weight: 600;
}
.expert-status-body {
    padding: 48px 32px 32px;
    text-align: center;
}
.expert-badge-icon {
    width: 96px;
    height: 96px;
    margin: 0 auto 24px;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 48px;
    box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);
    position: relative;
}
.expert-badge-icon::before {
    content: '';
    position: absolute;
    inset: -8px;
    border: 2px dashed rgba(16, 185, 129, 0.4);
    border-radius: 50%;
    animation: rotate 20s linear infinite;
}
@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
.expert-status-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 12px;
}
.expert-status-desc {
    color: #64748b;
    font-size: 0.9375rem;
    line-height: 1.6;
    margin-bottom: 32px;
}
.expert-action-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 14px 20px;
    margin-bottom: 12px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.9375rem;
    text-decoration: none;
    transition: all 0.2s;
    border: 1.5px solid transparent;
}
.expert-action-btn.primary {
    background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
    color: #fff;
    box-shadow: 0 2px 8px rgba(99, 102, 241, 0.25);
}
.expert-action-btn.primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    color: #fff;
}
.expert-action-btn.outline {
    background: #fff;
    color: #6366f1;
    border-color: #6366f1;
}
.expert-action-btn.outline:hover {
    background: rgba(99, 102, 241, 0.06);
}
.expert-action-btn.muted {
    background: #fff;
    color: #475569;
    border-color: #e2e8f0;
}
.expert-action-btn.muted:hover {
    background: #f8fafc;
}
.expert-action-btn i {
    margin-right: 8px;
    font-size: 1.05rem;
}
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="expert-status-card">
        <div class="expert-status-header">
            <i class="bi bi-award-fill"></i>
            <span>您已是专家用户</span>
        </div>
        <div class="expert-status-body">
            <div class="expert-badge-icon">
                <i class="bi bi-patch-check-fill"></i>
            </div>
            <div class="expert-status-title">恭喜！您已通过专家认证</div>
            <p class="expert-status-desc">您现在可以发布权威认证的内容，并对其他用户的内容进行验证和纠错。</p>
            <a href="{% url 'Community:create_post' %}" class="expert-action-btn primary">
                <i class="bi bi-plus-circle-fill"></i>发布新帖子
            </a>
            <a href="{% url 'Community:moderation_queue' %}" class="expert-action-btn outline">
                <i class="bi bi-shield-check"></i>审核内容
            </a>
            <a href="{% url 'User:profile' %}" class="expert-action-btn muted">
                <i class="bi bi-person"></i>查看个人资料
            </a>
        </div>
    </div>
</div>
{% endblock %}
