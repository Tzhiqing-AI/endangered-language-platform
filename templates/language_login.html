{% load static %}
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 濒危语言保护平台</title>
    <link rel="stylesheet" href="{% static 'bootstrap-5.3.0-alpha1-dist/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'bootstrap-icons-1.13.1/font/bootstrap-icons.min.css' %}">
    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'bootstrap-5.3.0-alpha1-dist/js/bootstrap.bundle.min.js' %}"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f766e 0%, #0b1120 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px 35px;
            backdrop-filter: blur(10px);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-header .icon-wrapper {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #0f766e 0%, #0b1120 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .login-header .icon-wrapper i {
            font-size: 36px;
            color: white;
        }

        .login-header h2 {
            color: #2d3748;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .login-header p {
            color: #718096;
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 18px;
            z-index: 10;
            transition: color 0.3s;
        }

        .form-group input {
            padding: 14px 14px 14px 48px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            background: #f8fafc;
        }

        .form-group input:focus {
            border-color: #0f766e;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
            background: white;
            outline: none;
        }

        .form-group input:focus + .input-icon,
        .form-group input:focus ~ .input-icon {
            color: #0f766e;
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-left: 5px;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            cursor: pointer;
            accent-color: #0f766e;
        }

        .remember-me label {
            color: #718096;
            font-size: 14px;
            cursor: pointer;
            margin: 0;
        }

        .btn-login {
            background: linear-gradient(135deg, #0f766e 0%, #0b1120 100%);
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(102, 126, 234, 0.45);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #a0aec0;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .divider span {
            padding: 0 15px;
        }

        .register-link {
            text-align: center;
            color: #718096;
            font-size: 14px;
        }

        .register-link a {
            color: #0f766e;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .register-link a:hover {
            color: #0b1120;
            text-decoration: underline;
        }

        .alert-message {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .input-error {
            border-color: #ff6b6b !important;
        }

        /* 响应式设计 */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .login-card {
                padding: 28px 20px;
            }
            .login-header h2 {
                font-size: 22px;
            }
            .login-header .icon-wrapper {
                width: 64px;
                height: 64px;
            }
            .login-header .icon-wrapper i {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="icon-wrapper">
                    <i class="bi bi-person-fill"></i>
                </div>
                <h2>用户登录</h2>
                <p>欢迎回到濒危语言保护平台</p>
            </div>

            {% if message %}
                <div class="alert-message">
                    <i class="bi bi-exclamation-circle-fill"></i> {{ message }}
                </div>
            {% endif %}

            <form action="" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next|default:'' }}">

                <div class="form-group">
                    <label class="visually-hidden" for="login-username">用户名</label>
                    <i class="bi bi-person input-icon"></i>
                    <input type="text" id="login-username" class="form-control" placeholder="请输入用户名" required autofocus autocomplete="username" name="username">
                </div>

                <div class="form-group">
                    <label class="visually-hidden" for="login-password">密码</label>
                    <i class="bi bi-lock input-icon"></i>
                    <input type="password" id="login-password" class="form-control" placeholder="请输入密码" required autocomplete="current-password" name="password">
                </div>

                <div class="remember-me d-flex justify-content-between align-items-center">
                    <span>
                        <input type="checkbox" id="rememberMe" name="remember_me" value="yes">
                        <label for="rememberMe">记住登录状态</label>
                    </span>
                    <a href="{% url 'User:password_help' %}" class="small" style="color:#0f766e;text-decoration:none;">忘记密码？</a>
                </div>

                <button type="submit" class="btn-login">
                    <i class="bi bi-box-arrow-in-right"></i> 立即登录
                </button>

                <div class="divider"><span>或</span></div>

                <div class="register-link">
                    还没有账号？<a href="{% url 'User:register' %}">立即注册</a>
                </div>

                <div class="register-link mt-3">
                    <a href="{% url 'Dashboard:language' %}"><i class="bi bi-house-door me-1"></i>返回首页</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
