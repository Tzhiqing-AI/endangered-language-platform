<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>濒危语言保护平台</title>
    <style>
        :root {
            --ink-0: #04060d;
            --ink-1: #0b1120;
            --ink-2: #111827;
            --teal: #14b8a6;
            --teal-deep: #0f766e;
            --gold: #f59e0b;
            --gold-deep: #d97706;
            --text: #f8fafc;
            --muted: rgba(226, 232, 240, 0.68);
            --line: rgba(148, 163, 184, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 14%, rgba(15, 118, 110, 0.20), transparent 44%),
                radial-gradient(circle at 84% 84%, rgba(217, 119, 6, 0.14), transparent 40%),
                linear-gradient(180deg, var(--ink-0) 0%, var(--ink-1) 52%, #070b14 100%);
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', 'Microsoft YaHei', sans-serif;
            cursor: pointer;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 背景层 ===== */
        .scene {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
        }

        .glow-teal {
            width: 46vw;
            height: 46vw;
            min-width: 320px;
            min-height: 320px;
            top: -12%;
            left: -8%;
            background: radial-gradient(circle, rgba(20, 184, 166, 0.22), transparent 68%);
            animation: drift 26s infinite ease-in-out;
        }

        .glow-gold {
            width: 38vw;
            height: 38vw;
            min-width: 260px;
            min-height: 260px;
            right: -10%;
            bottom: -16%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.16), transparent 68%);
            animation: drift 30s infinite ease-in-out reverse;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(28px, 20px) scale(1.08); }
        }

        .grid {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(148, 163, 184, 0.10) 1px, transparent 1px);
            background-size: 34px 34px;
            mask-image: radial-gradient(ellipse at 50% 42%, rgba(0, 0, 0, 0.55), transparent 72%);
            -webkit-mask-image: radial-gradient(ellipse at 50% 42%, rgba(0, 0, 0, 0.55), transparent 72%);
        }

        .orbit {
            position: absolute;
            left: 50%;
            top: 48%;
            width: min(86vw, 880px);
            height: min(86vw, 880px);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(20, 184, 166, 0.10);
            box-shadow: inset 0 0 80px rgba(20, 184, 166, 0.04);
            animation: orbitSpin 60s linear infinite;
        }

        .orbit::before,
        .orbit::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(148, 163, 184, 0.08);
        }

        .orbit::before {
            inset: 7%;
        }

        .orbit::after {
            inset: 16%;
            border-color: rgba(245, 158, 11, 0.08);
        }

        @keyframes orbitSpin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: #e2e8f0;
            animation: twinkle var(--dur, 4s) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: var(--min, 0.2); transform: scale(0.8); }
            50% { opacity: var(--max, 0.75); transform: scale(1); }
        }

        .meteor {
            position: absolute;
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, rgba(226, 232, 240, 0.7), transparent);
            transform: rotate(-35deg);
            opacity: 0;
            animation: meteorFly 9s infinite ease-in;
        }

        @keyframes meteorFly {
            0% { opacity: 0; transform: translate(0, 0) rotate(-35deg); }
            6% { opacity: 0.7; }
            18% { opacity: 0; transform: translate(-360px, 250px) rotate(-35deg); }
            100% { opacity: 0; }
        }

        /* ===== 主内容 ===== */
        .stage {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.2rem;
        }

        .glass-card {
            width: min(92vw, 650px);
            padding: clamp(2.2rem, 5vw, 3.7rem) clamp(1.5rem, 5vw, 4rem);
            text-align: center;
            position: relative;
            overflow: hidden;
            border-radius: 28px;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, rgba(17, 24, 39, 0.82) 0%, rgba(11, 17, 32, 0.66) 100%);
            box-shadow:
                0 34px 90px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(255, 255, 255, 0.02),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            animation: cardIn 1s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 12%;
            right: 12%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(94, 234, 212, 0.45), rgba(245, 158, 11, 0.35), transparent);
        }

        .glass-card::after {
            content: '';
            position: absolute;
            width: 70%;
            height: 45%;
            left: 15%;
            top: -22%;
            background: radial-gradient(ellipse at center, rgba(20, 184, 166, 0.14), transparent 70%);
            pointer-events: none;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(26px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .kicker {
            display: inline-block;
            font-size: 0.66rem;
            font-weight: 700;
            letter-spacing: 0.28em;
            color: #5eead4;
            text-transform: uppercase;
        }

        .emblem {
            width: 86px;
            height: 86px;
            margin: 1.6rem auto 1.35rem;
            border-radius: 26px;
            display: grid;
            place-items: center;
            position: relative;
            border: 1px solid rgba(94, 234, 212, 0.26);
            background: linear-gradient(145deg, rgba(20, 184, 166, 0.18), rgba(245, 158, 11, 0.08));
            box-shadow:
                0 0 42px rgba(20, 184, 166, 0.18),
                inset 0 0 28px rgba(20, 184, 166, 0.08);
        }

        .emblem::before {
            content: '';
            position: absolute;
            inset: -14px;
            border-radius: 34px;
            border: 1px solid rgba(94, 234, 212, 0.10);
            animation: emblemPulse 6s infinite ease-in-out;
        }

        @keyframes emblemPulse {
            0%, 100% { opacity: 0.35; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.04); }
        }

        .emblem svg {
            width: 46px;
            height: 46px;
        }

        .title {
            font-size: clamp(1.85rem, 4vw, 2.7rem);
            font-weight: 700;
            line-height: 1.24;
            letter-spacing: 0.07em;
            background: linear-gradient(120deg, #ffffff 0%, #d1fae5 42%, #fef3c7 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 8px 28px rgba(0, 0, 0, 0.35));
        }

        .title-en {
            margin-top: 0.6rem;
            font-size: 0.68rem;
            letter-spacing: 0.38em;
            color: rgba(203, 213, 225, 0.72);
            text-transform: uppercase;
        }

        .tagline {
            max-width: 34rem;
            margin: 1.4rem auto 0;
            font-size: 0.94rem;
            line-height: 1.9;
            letter-spacing: 0.04em;
            color: var(--muted);
        }

        .progress {
            width: 168px;
            height: 2px;
            margin: 1.55rem auto 0;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.16);
            overflow: hidden;
        }

        .progress span {
            display: block;
            width: 42%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, var(--teal), var(--gold), transparent);
            animation: progressSlide 2.6s infinite ease-in-out;
        }

        @keyframes progressSlide {
            0% { transform: translateX(-110%); }
            100% { transform: translateX(340%); }
        }

        .enter-btn {
            margin-top: 1.65rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.82rem 1.75rem;
            border: none;
            border-radius: 999px;
            background-color: var(--gold);
            background-image: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
            color: var(--ink-1);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(217, 119, 6, 0.24);
            transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
        }

        .enter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 38px rgba(217, 119, 6, 0.30);
            filter: brightness(1.04);
        }

        .enter-btn .arrow {
            font-style: normal;
            transition: transform 0.25s ease;
        }

        .enter-btn:hover .arrow {
            transform: translateX(4px);
        }

        .enter-btn:focus-visible {
            outline: 2px solid #5eead4;
            outline-offset: 4px;
        }

        .hint {
            margin-top: 1.05rem;
            font-size: 0.72rem;
            letter-spacing: 0.16em;
            color: rgba(203, 213, 225, 0.68);
        }

        .stage-meta {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 1.7rem;
            z-index: 12;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.85rem;
            font-size: 0.62rem;
            letter-spacing: 0.22em;
            color: rgba(148, 163, 184, 0.38);
            text-transform: uppercase;
            pointer-events: none;
        }

        .stage-meta .meta-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(94, 234, 212, 0.5);
        }

        .ripple {
            position: fixed;
            border-radius: 50%;
            border: 1px solid rgba(94, 234, 212, 0.55);
            background: radial-gradient(circle, rgba(20, 184, 166, 0.18) 0%, transparent 70%);
            pointer-events: none;
            z-index: 100;
            animation: rippleExpand 0.7s ease-out forwards;
        }

        @keyframes rippleExpand {
            0% { width: 0; height: 0; opacity: 0.9; }
            100% { width: 160vmax; height: 160vmax; opacity: 0; }
        }

        @media (max-width: 640px) {
            .glass-card {
                border-radius: 24px;
                padding: 2.2rem 1.4rem 2.4rem;
            }

            .emblem {
                width: 72px;
                height: 72px;
                border-radius: 22px;
            }

            .emblem svg {
                width: 38px;
                height: 38px;
            }

            .title {
                letter-spacing: 0.04em;
            }

            .title-en {
                letter-spacing: 0.26em;
            }

            .tagline {
                font-size: 0.88rem;
            }

            .stage-meta {
                bottom: 1.1rem;
                font-size: 0.56rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .glow,
            .orbit,
            .star,
            .meteor,
            .emblem::before,
            .progress span,
            .glass-card {
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="glow glow-teal"></div>
        <div class="glow glow-gold"></div>
        <div class="grid"></div>
        <div class="orbit"></div>
        <div id="starLayer"></div>
        <div class="meteor" style="top: 18%; left: 72%; animation-delay: 2s;"></div>
        <div class="meteor" style="top: 8%; left: 54%; animation-delay: 10s;"></div>
    </div>

    <main class="stage">
        <section class="glass-card">
            <span class="kicker">Endangered Language Archive</span>

            <div class="emblem" aria-hidden="true">
                <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="globeGradient" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#5eead4"/>
                            <stop offset="1" stop-color="#fbbf24"/>
                        </linearGradient>
                    </defs>
                    <circle cx="24" cy="24" r="17" stroke="url(#globeGradient)" stroke-width="1.6"/>
                    <ellipse cx="24" cy="24" rx="8" ry="17" stroke="url(#globeGradient)" stroke-width="1.2" opacity="0.75"/>
                    <path d="M7 24H41" stroke="url(#globeGradient)" stroke-width="1.2" opacity="0.75"/>
                    <path d="M10 14C17.5 18.2 30.5 18.2 38 14" stroke="url(#globeGradient)" stroke-width="1.1" opacity="0.55"/>
                    <path d="M10 34C17.5 29.8 30.5 29.8 38 34" stroke="url(#globeGradient)" stroke-width="1.1" opacity="0.55"/>
                </svg>
            </div>

            <h1 class="title">濒危语言保护平台</h1>
            <div class="title-en">Endangered Language Protection</div>

            <p class="tagline">
                记录正在消失的声音、文字与世界观。<br>
                让每一种语言，都继续被听见。
            </p>

            <div class="progress" aria-hidden="true"><span></span></div>

            <button class="enter-btn" type="button">
                进入平台 <i class="arrow">→</i>
            </button>

            <p class="hint">点击任意处或按任意键继续</p>
        </section>

        <div class="stage-meta">
            <span>Linguistic Heritage</span>
            <span class="meta-dot"></span>
            <span>Archive 2026</span>
        </div>
    </main>

    <script>
        const starLayer = document.getElementById('starLayer');
        const starCount = 80;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            const size = 1 + Math.random() * 2.2;
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.setProperty('--dur', (2.6 + Math.random() * 3.8) + 's');
            star.style.setProperty('--min', (0.12 + Math.random() * 0.2).toFixed(2));
            star.style.setProperty('--max', (0.45 + Math.random() * 0.4).toFixed(2));
            star.style.animationDelay = Math.random() * 6 + 's';
            if (size > 2.4) {
                star.style.boxShadow = '0 0 8px rgba(226, 232, 240, 0.35)';
            }
            starLayer.appendChild(star);
        }

        let entering = false;

        function enterPlatform() {
            if (entering) return;
            entering = true;
            window.setTimeout(function () {
                window.location.href = '/Dashboard/language/';
            }, 420);
        }

        function createRipple(x, y) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            ripple.style.transform = 'translate(-50%, -50%)';
            document.body.appendChild(ripple);
            window.setTimeout(function () {
                ripple.remove();
            }, 700);
        }

        document.body.addEventListener('click', function (event) {
            createRipple(event.clientX, event.clientY);
            enterPlatform();
        });

        window.addEventListener('keydown', enterPlatform);
    </script>
</body>
</html>
