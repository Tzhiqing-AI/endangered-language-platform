{% extends 'base.html' %}
{% load static %}

{% block title %}无访问权限 - 濒危语言保护平台{% endblock %}

{% block extra_css %}
<style>
    .error-page {
        min-height: calc(100vh - var(--navbar-height) - var(--footer-height) - 100px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: var(--space-8);
    }

    .error-code {
        font-size: 8rem;
        font-weight: 800;
        background: linear-gradient(135deg, var(--warning) 0%, #d97706 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        margin-bottom: var(--space-4);
        letter-spacing: -0.05em;
    }

    .error-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--primary-800);
        margin-bottom: var(--space-3);
    }

    .error-message {
        font-size: 1rem;
        color: var(--primary-500);
        margin-bottom: var(--space-8);
        max-width: 400px;
    }

    .error-icon {
        width: 120px;
        height: 120px;
        border-radius: var(--radius-2xl);
        background: var(--warm-100);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: var(--space-6);
    }

    .error-icon i {
        font-size: 4rem;
        color: var(--warm-500);
    }
</style>
{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-icon">
        <i class="bi bi-shield-lock"></i>
    </div>
    <div class="error-code">403</div>
    <h1 class="error-title">无访问权限</h1>
    <p class="error-message">
        {{ message|default:"抱歉，您没有权限访问此页面。" }}
        如有疑问，请联系管理员。
    </p>
    <div class="d-flex gap-3">
        <a href="{% url 'Dashboard:language' %}" class="btn btn-primary btn-lg">
            <i class="bi bi-house-door"></i>
            返回首页
        </a>
        <a href="{% url 'Community:community_home' %}" class="btn btn-secondary btn-lg">
            <i class="bi bi-people"></i>
            去社区看看
        </a>
    </div>
</div>
{% endblock %}
