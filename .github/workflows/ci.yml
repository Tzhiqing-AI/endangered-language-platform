name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 代码质量检查
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          # 只安装 lint 所需的最小集合（完整开发依赖见 requirements-dev.txt）
          pip install flake8 black isort

      # 格式化检查暂作为提示项，避免历史代码未统一格式时阻断功能回归
      - name: Run isort (import check)
        continue-on-error: true
        run: isort --check-only --diff .

      - name: Run black (format check)
        continue-on-error: true
        run: black --check --diff .

      - name: Run flake8 (lint)
        continue-on-error: true
        run: flake8 . --max-line-length=120 --ignore=E501,W503

  # 安全扫描
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pip-audit bandit

      - name: Audit dependencies
        continue-on-error: true
        run: pip-audit -r requirements.txt

      - name: Run bandit (static security analysis)
        continue-on-error: true
        run: bandit -r . -ll --exclude ./.venv,./node_modules

  # Django 检查
  django-check:
    name: Django System Check
    runs-on: ubuntu-latest
    env:
      # settings.py 在生产模式（DEBUG=False）下要求非 django-insecure- 前缀的密钥
      DJANGO_SECRET_KEY: ci-check-only-not-for-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config gcc

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django checks
        run: |
          python manage.py check --settings=language.settings_test
          python manage.py check --deploy --settings=language.settings_test

  # 运行测试（带覆盖率）
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: django-check
    env:
      DJANGO_SECRET_KEY: ci-test-only-not-for-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config gcc

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest --ds=language.settings_test --cov=. --cov-report=term-missing --cov-report=html -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # Docker 构建
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          # 构建上下文为 language/；ETL 从 elcat_source 数据库读取，无需挂载数据目录
          docker build -t endangered-language-app:${{ github.sha }} .
          docker tag endangered-language-app:${{ github.sha }} endangered-language-app:latest

      - name: Run container health check
        run: |
          docker run -d --name test-app -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci-docker-only-not-for-production \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,test-app \
            endangered-language-app:latest
          sleep 10
          docker logs test-app
          docker stop test-app
