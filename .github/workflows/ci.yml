name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 代码质量检查
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install flake8 black isort

      - name: Run isort (import check)
        run: isort --check-only --diff .

      - name: Run black (format check)
        run: black --check --diff .

      - name: Run flake8 (lint)
        run: flake8 . --max-line-length=120 --ignore=E501,W503

  # 安全扫描
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pip-audit bandit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      - name: Run bandit (static security analysis)
        run: bandit -r . -c pyproject.toml 2>/dev/null || bandit -r . -ll --exclude ./.venv,./node_modules

  # Django 检查
  django-check:
    name: Django System Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt 2>/dev/null || pip install Django mysqlclient

      - name: Run Django checks
        run: |
          python manage.py check
          python manage.py check --deploy

  # 运行测试（带覆盖率）
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: django-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt 2>/dev/null || pip install Django pytest pytest-django pytest-cov

      - name: Run tests with coverage
        run: |
          pytest --ds=language.settings_test --cov=. --cov-report=term-missing --cov-report=html -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # Docker 构建
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t endangered-language-app:${{ github.sha }} .
          docker tag endangered-language-app:${{ github.sha }} endangered-language-app:latest

      - name: Run container health check
        run: |
          docker run -d --name test-app -p 8000:8000 endangered-language-app:latest
          sleep 10
          docker logs test-app
          docker stop test-app
